<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کتابخانه الکترونیک</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">📚 کتاب‌یار</h1>
            <nav class="nav">
                <ul>
                    <li><a href="#">خانه</a></li>
                    <li><a href="#">کتاب‌ها</a></li>
                    <li><a href="#">دسته‌بندی</a></li>
                    <li><a href="#">درباره ما</a></li>
                </ul>
            </nav>
            <div class="search-box">
                <input type="text" placeholder="جستجوی کتاب...">
                <button>🔍</button>
            </div>
        </div>
    </header>

    <section class="hero">
        <div class="container">
            <h2>کتابخانه الکترونیک شخصی شما</h2>
            <p>بیش از ۱۰۰۰ کتاب رایگان در موضوعات مختلف</p>
            <a href="#" class="btn">شروع مطالعه</a>
        </div>
    </section>

    <section class="featured">
        <div class="container">
            <h2 class="section-title">📖 کتاب‌های ویژه</h2>
            <div class="books-grid" id="books-container"></div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>© ۲۰۲۵ کتاب‌یار | تمامی حقوق محفوظ است.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
